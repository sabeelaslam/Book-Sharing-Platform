{% extends "base.html" %}

{% block title %}Suggest Alternative - Book Sharing Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xl-6">
        
        <!-- Page Heading -->
        <div class="text-center m-4">
            <h3 class="fw-bold mb-0">Suggest Alternative</h3>
            <p class="text-muted small mb-0">Update details for the physical book request</p>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form action="#" method="POST">
                    
                    <!-- Non-Editable Fields -->
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label text-muted small fw-bold">Borrower Name</label>
                            <input type="text" class="form-control bg-light" value="{{ req.borrower.username }}" readonly disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Created On</label>
                            <input type="text" class="form-control bg-light" value="{{ req.created_at.strftime('%Y-%m-%d %H:%M') }}" readonly disabled>
                        </div>
                    </div>

                    <hr class="text-muted my-4">

                    <!-- Editable Fields -->
                    <div class="row mb-3 mt-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="proposed_date" class="form-label fw-bold">Alternative Date</label>
                            <input type="date" class="form-control" id="proposed_date" name="proposed_date" value="{{ req.proposed_date }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="proposed_time" class="form-label fw-bold">Alternative Time</label>
                            <input type="time" class="form-control" id="proposed_time" name="proposed_time" value="{{ req.proposed_time }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label fw-bold">Meeting Location</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ req.location }}" placeholder="e.g., Campus Library, Main Gate" required>
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label fw-bold">Message to Borrower</label>
                        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Add a message regarding the alternative arrangement..."></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary fw-bold px-4 py-2 w-50 shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Update Request
                        </button>
                        <a href="{{ url_for('main.view_requests')}}" class="btn btn-light fw-bold px-4 py-2 w-50 border text-dark shadow-sm">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
