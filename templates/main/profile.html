{% extends 'base.html' %}

{% block title %}Profile - Book Sharing Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
        <div class="card shadow-sm border-0 rounded-4 mt-3">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle display-4 text-primary"></i>
                    <h2 class="fw-bold mt-2">Your Profile</h2>
                    <p class="text-muted">Update your account details</p>
                </div>

                <form method="POST" action="{{ url_for('main.profile') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="username">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" id="username" name="username" class="form-control form-control-lg bg-light border-start-0 ps-0" value="{{ current_user.username }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" for="email">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <!-- Readonly field -->
                            <input type="email" id="email" name="email" class="form-control form-control-lg text-muted border-start-0 ps-0" style="background-color: #e9ecef;" value="{{ current_user.email }}" readonly>
                        </div>
                        <small class="text-muted mt-1 d-block"><i class="bi bi-info-circle"></i> Your email address cannot be changed.</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold" for="password">New Password (Optional)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" id="password" name="password" class="form-control form-control-lg bg-light border-start-0 ps-0" placeholder="Type new password">
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        {% if current_user.role == 'Admin' %}
                        <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-light btn-lg w-50 border shadow-sm">Cancel</a>
                        {% else %}
                        <a href="{{ url_for('main.home') }}" class="btn btn-light btn-lg w-50 border shadow-sm">Cancel</a>
                        {% endif %}
                        <button type="submit" class="btn btn-primary btn-lg w-50 border-0 bg-gradient-primary shadow-sm">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
